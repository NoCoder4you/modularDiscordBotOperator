[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-discord-bot-operator"
version = "0.1.0"
description = "Management foundation for isolated Discord bot processes"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["shared*", "portal*", "supervisor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
